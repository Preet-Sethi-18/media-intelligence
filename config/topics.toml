# Topic vocabulary (decisions D09 and D23): geopolitical topics for the Al Jazeera news source, AI-industry topics for
# the Hacker News and Mastodon sources. Patterns match whole tokens case-insensitively with spaCy's PhraseMatcher, so
# substrings never match ("electionsoftware" is not an election). A match whose head word is used as a verb ("trade
# accusations", "they hacked it") is rejected, and overlapping matches keep the longest phrase ("trade war" is trade,
# not military conflict). A pattern may belong to only one topic.
# Known limits: a fixed vocabulary misses paraphrases and new themes, and noun senses outside the intended domain can
# still overmatch (a sports "trade", a "war on drugs", an "acquisition" of weapons).
# AI-topic patterns are deliberately multi-word or unambiguous: bare "model", "agents", "chips", "investment" and
# "takeover" are left out because news text uses them in other senses ("business model", "FBI agents", "bargaining
# chip", "trade and investment", "Taliban takeover"), and so is bare "hack" (on Hacker News usually a workaround).

[[topics]]
name = "diplomacy"
patterns = ["diplomacy", "diplomatic relations", "diplomatic ties", "diplomatic efforts", "diplomatic solution",
            "peace talks", "peace process", "peace deal", "peace plan", "peace agreement", "mediation"]

[[topics]]
name = "sanctions"
patterns = ["sanctions", "sanction", "embargo", "embargoes", "arms embargo", "export controls", "asset freeze",
            "asset freezes"]

[[topics]]
name = "ceasefire"
patterns = ["ceasefire", "ceasefires", "cease-fire", "truce", "armistice", "humanitarian pause",
            "cessation of hostilities"]

[[topics]]
name = "trade"
patterns = ["trade", "trade deal", "trade war", "trade talks", "trade agreement", "free trade", "tariff",
            "tariffs", "exports", "imports"]

[[topics]]
name = "migration"
patterns = ["migration", "migrant", "migrants", "immigration", "immigrants", "refugee", "refugees", "asylum",
            "asylum seekers", "deportation", "deportations", "border crossings"]

[[topics]]
name = "elections"
patterns = ["election", "elections", "electoral", "referendum", "election campaign"]

[[topics]]
name = "military conflict"
patterns = ["military conflict", "armed conflict", "war", "wars", "warfare", "invasion", "airstrike", "airstrikes",
            "air strike", "air strikes", "missile strike", "missile strikes", "drone strike", "drone strikes",
            "military offensive", "ground offensive", "military operation", "hostilities", "shelling",
            "bombardment"]

[[topics]]
name = "nuclear programme"
patterns = ["nuclear programme", "nuclear program", "uranium enrichment", "enriched uranium", "enrichment",
            "nuclear deal", "nuclear talks", "nuclear weapons", "nuclear weapon", "nuclear facilities",
            "nuclear sites", "JCPOA"]

