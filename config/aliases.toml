# Reviewed identity aliases (decision D12). Lookup is exact on the whole entity text after Unicode, case and
# whitespace normalization and removal of a leading "the"; there is no fuzzy matching. A configured entry also
# fixes the stored type, overriding spaCy's label (the small model often tags surnames as ORG/FAC).
# Handles are matched only as "@handle" in text. Unmapped handles and usernames never become graph nodes.
# Single-word person aliases yield to a full name with the same surname in the same item (context wins).
# A country, its capital, its government and its leader are deliberately NOT aliased to each other
# (e.g. "Kremlin" is not "Russia"). Every alias or handle may map to exactly one entity.
# The same rule applies to companies: a parent and its subsidiary (Alphabet / Google / Google DeepMind), a company
# and its founder, and a company and its products (OpenAI / ChatGPT) stay separate nodes.
# Product and model names (ChatGPT, Claude, Gemini, Llama, Grok) are typed ORG: the schema has no PRODUCT type and
# ORG is the closest "named non-person actor or artifact"; it keeps the small model from reading "Claude" or "Meta"
# as a PERSON. Product nodes are never merged into their maker and no maker link is invented.
# Handles are listed only where the account is the entity's own, well-known account (e.g. @sama for Sam Altman).
# Media-outlet handles (@arstechnica) are deliberately absent: on Mastodon they open every reply as an address,
# so mapping them would connect the outlet to everything said in its replies.

# Organisations
[[entities]]
canonical = "United Nations"
type = "ORG"
aliases = ["UN", "U.N."]
handles = ["UN"]

