# Locations (country names only; not capitals or governments). A nationality adjective ("Iranian attacks", "the
# Iranian Foreign Ministry") is listed as an alias of its country: it names the same country, while the capital, the
# government and the leader stay separate nodes. Multi-word phrases that contain one ("Latin American") are
# separate spans and do not match.
[[entities]]
canonical = "United States"
type = "LOCATION"
aliases = ["US", "U.S.", "USA", "U.S.A.", "United States of America", "America", "American"]

[[entities]]
canonical = "United Kingdom"
type = "LOCATION"
