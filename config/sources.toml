# Corpus: Al Jazeera geopolitics incl. AI/tech geopolitics (news), Hacker News AI-industry threads (discussion),
# Mastodon AI-industry posts (microblog).
# All crawl URLs live in configuration; change seeds here, not in code.
# Sources are candidates until a live run confirms usable article/thread/post bodies.
aliases_file = "aliases.toml"
topics_file = "topics.toml"

[crawl]
max_depth = 1
max_pages_total = 30
max_pages_per_source = 10
request_timeout_seconds = 60
max_retries = 2
delay_per_host_seconds = 2
max_body_characters = 100000
max_comments_per_thread = 100
respect_robots = true
save_raw = false

[[sources]]
name = "aljazeera"
source_type = "news"
adapter = "article"
allowed_domains = ["www.aljazeera.com", "aljazeera.com"]
include_paths = ["^/(news|features|economy)/20[0-9]{2}/[0-9]{1,2}/[0-9]{1,2}/[a-z0-9-]+/?$"]
# Section and tag pages may be seeds: their article links are followed, the pages themselves are never stored, and a
# section link found on an article is not crawled (listings are entry points only).
listing_paths = ["^/(news|features|economy|middle-east|africa|asia|us-canada|latin-america|europe|asia-pacific)/?$",
                 "^/(tag|where)/[a-z0-9-]+/?$"]
body_selector = ".wysiwyg"
# Inside .wysiwyg: the "Recommended Stories" list (other articles' headlines), the newsletter sign-up form and ads.
exclude_selectors = [".more-on", ".sib-newsletter-form", ".container--ads"]
seeds = [
  "https://www.aljazeera.com/news/2026/9/17/what-are-all-the-sanctions-iran-is-under",
  "https://www.aljazeera.com/news/2026/2/26/iran-us-set-to-hold-talks-as-trump-threatens-force-imposes-sanctions",
  "https://www.aljazeera.com/news/2026/6/19/us-export-ban-on-anthropics-ai-models-further-strains-alliances",
  "https://www.aljazeera.com/economy/2026/8/25/nvidia-supermicro-employees-charged-over-export-of-ai-servers-to-china",
]

[[sources]]
# Community discussion of the AI industry (models, deals, markets, CEOs).
# robots.txt allows /item pages and asks for Crawl-delay: 30.
# Seeds may be thread pages (/item?id=...) or listing pages (front page, /best, /newest, /ask, /show):
# links are followed only from listings, because in-thread links are comment permalinks of the same thread.
name = "hackernews"
source_type = "discussion"
adapter = "hackernews"
allowed_domains = ["news.ycombinator.com"]
include_paths = ["^/item$"]
listing_paths = ["^/$", "^/(news|best|newest|front|ask|show)$"]
follow_links = "listings"
min_delay_seconds = 30
seeds = [
  "https://news.ycombinator.com/item?id=49458161",
  "https://news.ycombinator.com/item?id=49411102",
  "https://news.ycombinator.com/item?id=49905633",
  "https://news.ycombinator.com/item?id=49563355",
]

[[sources]]
# Microblog posts about the AI industry from tech outlets, with public replies (mastodon.social only:
# other servers publish their own robots.txt). Posts render client-side, so wait for the focused status.
# Depth 0: in-thread links are reply permalinks that re-show part of the same thread. Seeds must be post URLs:
# profile and tag pages expose almost no post links to logged-out crawlers (checked live, 8 Oct 2026).
name = "mastodon"
source_type = "microblog"
adapter = "mastodon"
allowed_domains = ["mastodon.social"]
include_paths = ["^/@[A-Za-z0-9_]+(@[A-Za-z0-9.-]+)?/[0-9]+$"]
max_depth = 0
wait_for = "css:.detailed-status"
render_wait_seconds = 4
seeds = [
  "https://mastodon.social/@arstechnica/117360380860542852",
  "https://mastodon.social/@arstechnica/117354726707655751",
  "https://mastodon.social/@arstechnica/117361815008751916",
  "https://mastodon.social/@arstechnica/117393939359981830",
  "https://mastodon.social/@arstechnica/117361478064738659",
  "https://mastodon.social/@404mediaco/117344659806515505",
]
